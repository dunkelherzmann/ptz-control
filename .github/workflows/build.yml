# Builds and tests every version on GitHub's own runners for each pull request and push to main.
# Release builds are still made and installed on Herbert's own Mac, Linux and Windows machines.
name: Build
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: macos/scripts/build.sh
      - run: scripts/test-core.sh
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The Flatpak runtime has a newer Qt than Ubuntu 24.04 ships.
      - uses: jurplel/install-qt-action@v4
        with: { version: "6.8.*", cache: true }
      - run: sudo apt-get update -q && sudo apt-get install -yq libcurl4-openssl-dev libgl-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: sh scripts/version.sh --header
      - run: cmake -S linux -B .build/linux && cmake --build .build/linux -j
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: powershell -ExecutionPolicy Bypass -File windows\scripts\build.ps1
